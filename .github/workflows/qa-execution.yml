name: Phase 4 - Automated QA Execution Gate

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  qa_testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute QA Test Suite
        run: python .github/scripts/qa_execution.py
